title: luthebao
tagline: Coding & software write-ups
description: >-
  Personal site of luthebao (BaoLT) — native apps, developer tools, and the
  occasional Flash emulator. Write-ups on the software I build.
url: https://www.beyonderluu.com
lang: en
author: BaoLT

github_username: luthebao
social_site: https://beyonderluu.com

# --- Build ---
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

sass:
  style: compressed

# Posts render with the post layout; index.md and about.md set their own.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# jekyll-feed output path
feed:
  path: feed.xml

# Keep tooling, raw data, and internal docs out of the published site.
exclude:
  - vpt/
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - docs/
  - .jekyll-cache/
  - node_modules/
