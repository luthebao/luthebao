<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} — home">
      <span class="brand__prompt" aria-hidden="true">$</span>
      <span class="brand__name">{{ site.title }}</span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <a class="site-nav__link site-nav__link--text" href="{{ '/' | relative_url }}#posts">posts</a>
      <a class="site-nav__link site-nav__link--text" href="{{ '/about/' | relative_url }}"
         {% if page.url == '/about/' %}aria-current="page"{% endif %}>about</a>

      <span class="site-nav__sep" aria-hidden="true"></span>

      <a class="icon-btn" href="https://github.com/{{ site.github_username }}"
         target="_blank" rel="me noopener" aria-label="GitHub profile (opens in a new tab)">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.54-3.88-1.54-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"/></svg>
      </a>

      <button class="theme-toggle icon-btn" type="button" aria-pressed="false" aria-label="Switch to dark theme" title="Toggle theme">
        <span class="theme-toggle__icon icon-moon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </span>
        <span class="theme-toggle__icon icon-sun" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.2v2.3M12 19.5v2.3M4.2 12H1.9M22.1 12h-2.3M5.6 5.6 4 4M20 20l-1.6-1.6M18.4 5.6 20 4M4 20l1.6-1.6"/></svg>
        </span>
      </button>
    </nav>
  </div>
</header>
